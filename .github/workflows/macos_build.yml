name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  build:
    needs: validation
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APP_PATH: ${{ github.workspace }}/DerivedData/Build/Products/Release/Amazon Bedrock.app
      DMG_PATH: Amazon Bedrock Client for Mac.dmg

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable
      - name: Check version and main ancestry
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/verify-release.py --tag "$RELEASE_TAG"
          xcrun agvtool new-version -all "$GITHUB_RUN_NUMBER"
      - name: Import Developer ID certificate
        uses: Apple-Actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTS_P12 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
      - name: Install packaging tool
        run: brew install create-dmg
      - name: Resolve committed dependencies
        run: |
          mkdir -p artifacts
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project "Amazon Bedrock Client for Mac.xcodeproj" \
            -scheme "Amazon Bedrock Client for Mac" \
            -derivedDataPath DerivedData \
            -onlyUsePackageVersionsFromResolvedFile \
            2>&1 | tee artifacts/dependencies.log
      - name: Build optimized universal app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "Amazon Bedrock Client for Mac.xcodeproj" \
            -scheme "Amazon Bedrock Client for Mac" \
            -configuration Release \
            -arch x86_64 -arch arm64 \
            -derivedDataPath DerivedData \
            -disableAutomaticPackageResolution \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            2>&1 | tee artifacts/build.log
      - name: Verify version, architectures and signature
        run: |
          python3 scripts/verify-release.py --app "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2> artifacts/signature.log
          lipo -verify_arch arm64 x86_64 "$APP_PATH/Contents/MacOS/Amazon Bedrock"
          grep -q 'flags=.*runtime' artifacts/signature.log
      - name: Store notarization credentials in the runner keychain
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials bedrock-release \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
      - name: Notarize and staple the app
        run: |
          ditto -c -k --keepParent "$APP_PATH" artifacts/Amazon_Bedrock.zip
          python3 scripts/notarize.py artifacts/Amazon_Bedrock.zip --report artifacts/notarization-app.json
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          rm artifacts/Amazon_Bedrock.zip
      - name: Package universal DMG
        run: |
          create-dmg --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Amazon Bedrock.app" 200 190 \
            --hide-extension "Amazon Bedrock.app" \
            --app-drop-link 600 185 \
            "$DMG_PATH" "$APP_PATH"
      - name: Notarize and verify the DMG
        run: |
          python3 scripts/notarize.py "$DMG_PATH" --report artifacts/notarization-dmg.json
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          shasum -a 256 "$DMG_PATH" > SHA256SUMS.txt
      - name: Preserve build and notarization evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}
          path: |
            artifacts/*.log
            artifacts/*.json
            SHA256SUMS.txt
          retention-days: 30
      - name: Upload tested distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Amazon Bedrock Client for Mac
          path: |
            Amazon Bedrock Client for Mac.dmg
            SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: Bedrock for Mac ${{ github.ref_name }}
          body_path: docs/releases/${{ env.RELEASE_VERSION }}.md
          fail_on_unmatched_files: true
          files: |
            Amazon Bedrock Client for Mac.dmg
            SHA256SUMS.txt
          draft: false
          prerelease: false
      - name: Update Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.BREW_TOKEN }}
        run: |
          DMG_SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          brew tap didhd/tap
          brew bump-cask-pr --version="$RELEASE_VERSION" --no-browse --no-audit \
            --sha256="$DMG_SHA256" \
            --url="https://github.com/aws-samples/amazon-bedrock-client-for-mac/releases/download/v$RELEASE_VERSION/Amazon.Bedrock.Client.for.Mac.dmg" \
            didhd/tap/amazon-bedrock-client
