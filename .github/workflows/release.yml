name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vx.y.z tag with successful main CI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      APP_PATH: ${{ github.workspace }}/DerivedData/Build/Products/Release/Amazon Bedrock.app
      DMG_PATH: Amazon.Bedrock.Client.for.Mac.dmg
      LLVM_PROFILE_FILE: /tmp/bedrock-%p.profraw
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - name: Check out release automation
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the immutable release tag
        id: source
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cp scripts/verify-main-ci.py "$RUNNER_TEMP/verify-main-ci.py"
          echo "revision=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Check out the tested revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          fetch-depth: 0
      - name: Verify and reuse successful main CI
        id: validation
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$RUNNER_TEMP/verify-main-ci.py" \
            --tag "$RELEASE_TAG" --root "$GITHUB_WORKSPACE" --output artifacts
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ steps.validation.outputs.xcode }}
      - name: Restore pinned Swift packages
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/BedrockPackages
          key: swift-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Bedrock.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Restore distribution build intermediates
        id: distribution-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: DerivedData
          key: distribution-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.validation.outputs.xcode }}-${{ hashFiles('Bedrock.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ steps.source.outputs.revision }}
          restore-keys: |
            distribution-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.validation.outputs.xcode }}-${{ hashFiles('Bedrock.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
      - name: Check version and main ancestry
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/verify-release.py --tag "$RELEASE_TAG"
          xcrun agvtool new-version -all "$GITHUB_RUN_NUMBER"
      - name: Import Developer ID certificate
        uses: Apple-Actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTS_P12 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
      - name: Install packaging tool
        run: brew list --versions create-dmg >/dev/null || brew install create-dmg
      - name: Resolve committed dependencies
        run: |
          mkdir -p artifacts
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project "Bedrock.xcodeproj" \
            -scheme Bedrock \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BedrockPackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            2>&1 | tee artifacts/dependencies.log
      - name: Build optimized universal app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "Bedrock.xcodeproj" \
            -scheme Bedrock \
            -configuration Release \
            -arch x86_64 -arch arm64 \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BedrockPackages" \
            -disableAutomaticPackageResolution \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            2>&1 | tee artifacts/build.log
      - name: Verify version, architectures and signature
        run: |
          python3 scripts/verify-release.py --app "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2> artifacts/signature.log
          xcrun lipo "$APP_PATH/Contents/MacOS/Amazon Bedrock" -verify_arch arm64
          xcrun lipo "$APP_PATH/Contents/MacOS/Amazon Bedrock" -verify_arch x86_64
          grep -q 'flags=.*runtime' artifacts/signature.log
      - name: Store notarization credentials in the runner keychain
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials bedrock-release \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
      - name: Notarize and staple the app
        run: |
          ditto -c -k --keepParent "$APP_PATH" artifacts/Amazon_Bedrock.zip
          python3 scripts/notarize.py artifacts/Amazon_Bedrock.zip --report artifacts/notarization-app.json
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          syspolicy_check distribution "$APP_PATH"
          rm artifacts/Amazon_Bedrock.zip
      - name: Package universal DMG
        run: |
          mkdir -p "$RUNNER_TEMP/BedrockDistribution"
          ditto "$APP_PATH" "$RUNNER_TEMP/BedrockDistribution/Amazon Bedrock.app"
          # The 1.x updater locates this exact volume name.
          create-dmg --volname "Amazon Bedrock Client for Mac" --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Amazon Bedrock.app" 200 190 \
            --hide-extension "Amazon Bedrock.app" \
            --app-drop-link 600 185 \
            "$DMG_PATH" "$RUNNER_TEMP/BedrockDistribution"
          codesign --force --timestamp --sign "Developer ID Application" "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
      - name: Notarize and verify the DMG
        run: |
          python3 scripts/notarize.py "$DMG_PATH" --report artifacts/notarization-dmg.json
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"
          shasum -a 256 "$DMG_PATH" > SHA256SUMS.txt
      - name: Verify the packaged installation
        run: |
          BEDROCK_DMG_VOLUME="$RUNNER_TEMP/BedrockDMG"
          mkdir -p "$BEDROCK_DMG_VOLUME"
          hdiutil attach -readonly -nobrowse -mountpoint "$BEDROCK_DMG_VOLUME" "$DMG_PATH"
          trap 'hdiutil detach "$BEDROCK_DMG_VOLUME"' EXIT
          test "$(diskutil info -plist "$BEDROCK_DMG_VOLUME" | plutil -extract VolumeName raw -o - -)" = "Amazon Bedrock Client for Mac"
          python3 scripts/verify-release.py --app "$BEDROCK_DMG_VOLUME/Amazon Bedrock.app"
          codesign --verify --deep --strict --verbose=2 "$BEDROCK_DMG_VOLUME/Amazon Bedrock.app"
          xcrun stapler validate "$BEDROCK_DMG_VOLUME/Amazon Bedrock.app"
          cmp "$APP_PATH/Contents/MacOS/Amazon Bedrock" \
            "$BEDROCK_DMG_VOLUME/Amazon Bedrock.app/Contents/MacOS/Amazon Bedrock"
          test "$(readlink "$BEDROCK_DMG_VOLUME/Applications")" = /Applications
      - name: Require successful main CI before publication
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_REVISION: ${{ steps.source.outputs.revision }}
          MAIN_CI_RUN: ${{ steps.validation.outputs.run_id }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$TESTED_REVISION"
          gh run view "$MAIN_CI_RUN" \
            --json status,conclusion,headSha,headBranch,url > artifacts/main-ci-publication.json
          jq -e --arg sha "$TESTED_REVISION" \
            '.status == "completed" and .conclusion == "success" and .headSha == $sha and .headBranch == "main"' \
            artifacts/main-ci-publication.json
      - name: Preserve build and notarization evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}
          compression-level: 0
          path: |
            artifacts/*.log
            artifacts/*.json
            SHA256SUMS.txt
          retention-days: 30
      - name: Upload tested distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Amazon Bedrock Client for Mac
          compression-level: 0
          path: |
            Amazon.Bedrock.Client.for.Mac.dmg
            SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_VERSION }}.md
          fail_on_unmatched_files: true
          files: |
            Amazon.Bedrock.Client.for.Mac.dmg
            SHA256SUMS.txt
            docs/assets/demo.mp4
          draft: false
          prerelease: false
      - name: Update Homebrew cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.BREW_TOKEN }}
        run: |
          DMG_SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          brew tap didhd/tap
          brew bump-cask-pr --version="$RELEASE_VERSION" --no-browse --no-audit \
            --sha256="$DMG_SHA256" \
            --url="https://github.com/aws-samples/amazon-bedrock-client-for-mac/releases/download/v$RELEASE_VERSION/Amazon.Bedrock.Client.for.Mac.dmg" \
            didhd/tap/amazon-bedrock-client
      - name: Save distribution build intermediates for the next release
        if: success() && steps.distribution-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: DerivedData
          key: ${{ steps.distribution-cache.outputs.cache-primary-key }}
